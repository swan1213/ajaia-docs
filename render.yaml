# Render blueprint: one free web service (Docker) + one free Postgres.
# New > Blueprint in the Render dashboard, point it at this repo, click Apply.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-docs-db
          property: connectionString
      - key: SEED_DEMO
        value: "1"

databases:
  - name: ajaia-docs-db
    plan: free
